<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>漫客 · 密码激活</title>
<link rel="icon" type="image/png" href="/favicon-48.png" />
<style>
  :root{color-scheme:dark}
  html,body{height:100%}
  body{margin:0;background:#0b0c0e;color:#e6e6e6;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .author{position:fixed;top:16px;left:22px;font-size:12px;color:#8c8c8c;display:flex;align-items:center;gap:8px}
  .author b{color:#fff;font-weight:600}
  .card{width:420px;max-width:calc(100vw - 40px);background:#121317;border:1px solid #23252b;border-radius:18px;padding:34px 32px 30px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.55)}
  .logo{height:56px;width:auto;margin-bottom:10px}
  h1{margin:0;font-size:26px;letter-spacing:2px}
  .sub{margin:10px 0 24px;color:#9a9a9a;font-size:13px}
  .field{display:flex;gap:10px}
  input{flex:1;height:46px;border-radius:10px;border:1px solid #2c2f36;background:#0b0c0e;color:#fff;padding:0 14px;font-size:15px;outline:none}
  input:focus{border-color:#ff6a3d}
  button{height:46px;padding:0 20px;border:0;border-radius:10px;background:#ff6a3d;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #msg{margin-top:14px;min-height:20px;font-size:13px;color:#ff8f6b}
  .ok{color:#39d98a !important}
  .tip{margin-top:18px;font-size:12px;color:#666}

@font-face{font-family:"ManKe Sans";src:url(/fonts/NotoSansSC-VF.ttf)format("truetype-variations");font-weight:100 900;font-style:normal;font-display:swap}
html,body{height:100%;background:#070911!important}
body{
  margin:0;color:#f3f6fc!important;
  font-family:"ManKe Sans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif!important;
  font-size:14.5px!important;font-weight:440!important;letter-spacing:.012em!important;
  -webkit-font-smoothing:auto;text-rendering:optimizeLegibility;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 620px at 10% -10%,rgba(96,124,255,.30),transparent 62%),
    radial-gradient(760px 560px at 92% 0%,rgba(255,106,61,.22),transparent 58%),
    radial-gradient(820px 680px at 50% 115%,rgba(124,86,255,.24),transparent 62%),
    linear-gradient(180deg,#0b0e18,#070911 55%,#05060b)!important;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 18%,#000 0%,transparent 78%);
  mask-image:radial-gradient(ellipse at 50% 18%,#000 0%,transparent 78%);
}
.card{
  width:430px;max-width:calc(100vw - 40px);
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045))!important;
  border:1px solid rgba(255,255,255,.16)!important;border-radius:22px!important;
  padding:36px 34px 32px!important;
  -webkit-backdrop-filter:blur(26px) saturate(165%);backdrop-filter:blur(26px) saturate(165%);
  box-shadow:0 34px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)!important;
}
.logo{height:60px!important;margin-bottom:12px!important}
h1{margin:0;font-size:27px!important;font-weight:650!important;letter-spacing:1px!important;color:#fff!important}
.sub{margin:10px 0 24px!important;color:#bcc5d6!important;font-size:13.5px!important}
.field{display:flex;gap:10px}
input{
  flex:1;height:48px!important;border-radius:12px!important;
  border:1px solid rgba(255,255,255,.16)!important;
  background:rgba(8,10,16,.55)!important;color:#fff!important;
  padding:0 14px!important;font-size:15px!important;outline:none!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)!important;
}
input::placeholder{color:rgba(200,208,224,.55)!important}
input:focus{border-color:rgba(255,106,61,.7)!important;box-shadow:0 0 0 3px rgba(255,106,61,.18)!important}
button{
  height:48px!important;padding:0 22px!important;border:0!important;border-radius:12px!important;
  background:linear-gradient(135deg,#ff6a3d,#ff8f5e)!important;color:#fff!important;
  font-size:15px!important;font-weight:650!important;cursor:pointer!important;
  box-shadow:0 12px 28px rgba(255,106,61,.35),inset 0 1px 0 rgba(255,255,255,.25)!important;
}
button:hover{filter:brightness(1.05)}
button:disabled{opacity:.6!important;cursor:default!important;filter:none}
#msg{margin-top:14px!important;min-height:20px!important;font-size:13px!important;color:#ff9a7a!important}
.ok{color:#4ade80!important}
.tip{margin-top:18px!important;font-size:12.5px!important;color:#8f98aa!important}

</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/logo-mark.png" alt="漫客" />
  <h1>密码激活</h1>
  <p class="sub">首次使用请输入激活密码</p>
  <div class="field">
    <input id="pw" type="password" placeholder="激活密码" autofocus autocomplete="off" />
    <button id="go">激活</button>
  </div>
  <div id="msg"></div>
  <div class="tip">激活后即可进入漫客，本机长期有效</div>
</main>
<script>
(function(){
  var input=document.getElementById('pw'), btn=document.getElementById('go'), msg=document.getElementById('msg');
  function setMsg(t,ok){ msg.textContent=t; msg.className= ok ? 'ok' : ''; }
  async function activate(){
    var v=(input.value||'').trim();
    if(!v){ setMsg('请输入密码'); return; }
    if(!window.aics || !window.aics.passwordActivate){ setMsg('激活通道不可用，请从程序内打开'); return; }
    btn.disabled=true; setMsg('验证中…');
    try{
      var r=await window.aics.passwordActivate(v);
      if(r && r.ok){ setMsg('激活成功，正在进入…',true); setTimeout(function(){ location.href='/'; }, 900); }
      else { setMsg((r && r.msg) || '密码错误'); btn.disabled=false; }
    }catch(e){ setMsg('激活失败：'+((e&&e.message)||e)); btn.disabled=false; }
  }
  btn.addEventListener('click',activate);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter') activate(); });
})();
</script>
</body>
</html>
